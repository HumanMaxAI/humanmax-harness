name: Harness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  workspace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test

  generated-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify packed bootstrap and independent generated project
        run: node packages/cli/verification/distribution.mjs

  publish:
    needs: [workspace, generated-project]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@humanmax"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check publishing credentials are configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is missing. Configure it in Settings > Environments > prod > Environment secrets."
            exit 1
          fi
      - name: Publish packages that are not already on the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-workspaces.mjs
